name: Deploy site to GitHub Pages

# One workflow does bump → build → push → deploy, so a merge to main produces exactly
# one deployment. A push that changed package.json's version ships that exact version, so
# to choose the next release set it yourself (`npm version 2.1.0 --no-git-tag-version`
# updates the lockfile too); any other push is patch-bumped and the bump committed back.
# workflow_dispatch builds the committed version as-is.
#
# The bump commit is pushed with GITHUB_TOKEN, which never triggers workflows. Its
# [skip ci] marker keeps that true if the push is ever switched to a PAT or app token.
# GitHub never starts a push run whose head commit message contains [skip ci], [ci skip],
# [no ci], [skip actions] or [actions skip]: keep these out of PR titles and squash-merge
# messages, or that merge will not deploy (re-run it with workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write is needed only for the version-bump push. Requires the repository's
    # workflow permissions to allow write, and branch protection must let the Actions bot push.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Compares with the version main had before this push (none before v2, so v2.0.0 ships
      # as 2.0.0). The checkout is shallow, so fetch that commit; if it cannot be fetched,
      # bump as usual. An all-zero SHA means the branch was just created.
      - name: Bump patch version unless the push set it
        id: bump
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          CUR="$(node -p "require('./package.json').version")"
          PREV=""
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch --no-tags --depth=1 origin "$BEFORE"; then
              PREV="$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version ?? ''")"
            else
              echo "::warning::could not fetch $BEFORE; bumping as usual"
              PREV="$CUR"
            fi
          fi
          if [ "$PREV" = "$CUR" ]; then
            npm version patch --no-git-tag-version
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "package.json version set by this push (${PREV:-none} → $CUR); building it as-is"
          fi

      - name: Build site
        run: npm run build
        env:
          # GitHub Pages project-site URL so printed-chart QR codes resolve for this repository.
          VITE_CHARUCO_PRINT_SOURCE_URL: https://skelly.cam/c/

      # Push before uploading/deploying: if the bump cannot land (branch protection,
      # or another merge moved main), this run fails instead of deploying a version
      # that never reaches main.
      - name: Commit and push version bump
        if: steps.bump.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin HEAD:main

      # Requires repo Settings → Pages → Source: GitHub Actions (not “Deploy from a branch”).
      # Branch deploy serves root index.html (/src/*.ts), which 404s on static hosting.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
